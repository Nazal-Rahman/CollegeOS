<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1451d1" />
      <stop offset="50%" stop-color="#3b6ceb" />
      <stop offset="100%" stop-color="#6d42ba" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#edf0ff" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00174c" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- App Icon Background: Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#primaryGrad)" />
  
  <!-- Subtle inner radial glow -->
  <circle cx="256" cy="180" r="200" fill="#ffffff" opacity="0.12" />

  <!-- Shield Base with Shadow -->
  <g filter="url(#shadow)">
    <path d="M256 100 L380 145 C380 270 256 365 256 365 C256 365 132 270 132 145 Z" fill="url(#shieldGrad)" />
  </g>

  <!-- Inner Graduation Cap Motif in Primary Color -->
  <!-- Mortarboard Diamond -->
  <polygon points="256,155 350,195 256,235 162,195" fill="#1451d1" />
  
  <!-- Skull Cap / Neck Underneath -->
  <path d="M195 210 L195 250 C195 278 317 278 317 250 L317 210 Z" fill="#1954d4" />
  
  <!-- Tassel Ribbon & Bob -->
  <path d="M330 205 Q345 225 348 260" stroke="#006c4e" stroke-width="6" stroke-linecap="round" fill="none" />
  <circle cx="348" cy="264" r="6" fill="#006c4e" />

  <!-- Synchronized Cloud & Orbit Arc -->
  <path d="M175 305 Q256 340 337 305" stroke="#1451d1" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />
  <circle cx="256" cy="324" r="7" fill="#006c4e" />
</svg>
