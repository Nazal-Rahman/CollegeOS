<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <meta content="mobile_tab" name="shell-type"/>
  <title>Timetable Scheduler • College OS</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-low": "#f1f3ff",
            "inverse-primary": "#b4c4ff",
            "on-tertiary-fixed": "#260059",
            "primary": "#1451d1",
            "on-error-container": "#93000a",
            "error": "#ba1a1a",
            "on-secondary": "#ffffff",
            "primary-container": "#3b6ceb",
            "surface-container-highest": "#dbe2f9",
            "tertiary-fixed": "#ebddff",
            "surface-bright": "#f9f9ff",
            "tertiary-fixed-dim": "#d3bbff",
            "inverse-surface": "#293041",
            "background": "#f9f9ff",
            "on-surface-variant": "#434654",
            "secondary-container": "#77fac7",
            "surface-container-lowest": "#ffffff",
            "inverse-on-surface": "#edf0ff",
            "primary-fixed-dim": "#b4c4ff",
            "surface-tint": "#1954d4",
            "on-tertiary": "#ffffff",
            "surface-dim": "#d2daf0",
            "tertiary-container": "#865cd5",
            "primary-fixed": "#dbe1ff",
            "tertiary": "#6d42ba",
            "on-secondary-container": "#007353",
            "surface-variant": "#dbe2f9",
            "on-tertiary-fixed-variant": "#5729a3",
            "on-primary-fixed": "#00174c",
            "on-secondary-fixed-variant": "#00513a",
            "on-primary": "#ffffff",
            "on-background": "#141b2c",
            "on-secondary-fixed": "#002115",
            "outline-variant": "#c3c6d7",
            "secondary-fixed-dim": "#58ddac",
            "on-primary-container": "#fefcff",
            "surface-container": "#e9edff",
            "on-primary-fixed-variant": "#003daa",
            "on-error": "#ffffff",
            "secondary-fixed": "#77fac7",
            "outline": "#737686",
            "on-surface": "#141b2c",
            "error-container": "#ffdad6",
            "surface": "#f9f9ff",
            "secondary": "#006c4e",
            "surface-container-high": "#e0e8ff",
            "on-tertiary-container": "#fffbff"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "3xl": "1.5rem",
            "full": "9999px"
          },
          spacing: {
            margin: "1rem",
            "space-sm": "0.5rem",
            "space-md": "1rem",
            "space-xl": "2rem",
            "space-xs": "0.25rem",
            "space-lg": "1.25rem",
            gutter: "1rem"
          },
          fontFamily: {
            "label-md": ["Plus Jakarta Sans"],
            "headline-md": ["Plus Jakarta Sans"],
            "body-lg": ["Inter"],
            "label-sm": ["Plus Jakarta Sans"],
            "headline-lg": ["Plus Jakarta Sans"],
            "body-md": ["Inter"],
            "label-lg": ["Plus Jakarta Sans"],
            "headline-sm": ["Plus Jakarta Sans"],
            "body-sm": ["Inter"],
            "headline-xl": ["Plus Jakarta Sans"]
          }
        }
      }
    };
  </script>
  <style>
    @layer base {
      html, body {
        width: 100vw;
        margin: 0;
        padding: 0;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    ::-webkit-scrollbar { display: none; }
    body { min-height: max(884px, 100dvh); }

    /* Explicit visible scrollbar for modal scrollable body */
    .modal-scroll-container {
      scrollbar-width: thin;
      scrollbar-color: #9aa1bc #f1f3ff;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .modal-scroll-container::-webkit-scrollbar {
      display: block !important;
      width: 6px;
    }
    .modal-scroll-container::-webkit-scrollbar-track {
      background: #f1f3ff;
      border-radius: 9999px;
    }
    .modal-scroll-container::-webkit-scrollbar-thumb {
      background: #9aa1bc;
      border-radius: 9999px;
    }
    .modal-scroll-container::-webkit-scrollbar-thumb:hover {
      background: #1451d1;
    }
  </style>
</head>

<body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen">

  <!-- ============================================== -->
  <!-- HEADER -->
  <!-- ============================================== -->
  <header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="h-16 px-margin flex items-center justify-between gap-space-sm">
      <div class="flex items-center gap-space-sm min-w-0">
        <a href="index.html" class="flex items-center gap-space-sm">
          <img alt="College OS Logo" class="h-8 w-auto object-contain flex-shrink-0" src="/logo.png"/>
          <div class="flex flex-col min-w-0">
            <span class="font-headline-sm text-headline-sm text-on-surface truncate font-bold">College OS</span>
          </div>
        </a>
      </div>
      
      <div class="flex items-center gap-space-xs flex-shrink-0">
        <div class="flex items-center justify-center pl-space-xs">
          <a href="profile.html" title="Go to Profile" class="block transition-transform hover:scale-105 active:scale-95">
            <div class="w-8 h-8 rounded-full bg-surface-container-high border border-surface-container-highest flex items-center justify-center text-on-surface-variant ring-2 ring-primary/20">
              <span class="material-symbols-outlined text-[18px]">person</span>
            </div>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- ============================================== -->
  <!-- MAIN CONTENT                                   -->
  <!-- ============================================== -->
  <main class="flex-1 flex flex-col relative w-full pt-16 pb-28 bg-surface min-h-screen">
    <div class="flex flex-col w-full pb-10">
      
      <!-- Top Academic Context & Day Horizon -->
      <div class="px-margin pt-2 flex flex-col gap-space-md">
        
        <!-- Utility Sub-bar -->
        <div class="flex items-center justify-between gap-space-sm">
          <div class="flex flex-col min-w-0">
            <span class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-bold" id="weekRangeLabel">Academic Session</span>
            <h1 class="font-headline-md text-headline-md text-on-surface truncate font-bold">Class Timetable</h1>
          </div>
          
          <div class="flex items-center gap-1.5 flex-shrink-0">
            <button onclick="resetTimetable()" title="Reset to Empty State" class="w-8 h-8 rounded-lg bg-surface-container text-on-surface-variant hover:text-error hover:bg-error-container/40 flex items-center justify-center transition-all active:scale-95 shadow-sm">
              <span class="material-symbols-outlined text-[17px]">restart_alt</span>
            </button>
          </div>
        </div>

        <!-- Sunday to Saturday Horizon Strip -->
        <div class="flex flex-col gap-1.5">
          <div class="flex items-center justify-between text-xs text-on-surface-variant font-semibold px-1">
            <span>Select Day</span>
            <span id="activeDayLabel" class="text-primary font-bold">Sunday</span>
          </div>

          <!-- 7-Day Buttons Strip (Sunday to Saturday) -->
          <div class="grid grid-cols-7 gap-1.5 py-1" id="daysStrip">
            <!-- Day buttons rendered by JS -->
          </div>
        </div>

      </div>

      <!-- Schedule Content Container: Either Timeline OR First-Time User Empty State -->
      <div id="timetableContent" class="px-margin mt-space-md flex flex-col">
        <!-- Rendered dynamically via JavaScript -->
      </div>

    </div>

    <!-- Floating Action Button (+ Schedule Entry) -->
    <div class="fixed bottom-20 right-4 z-40">
      <button onclick="openScheduleModal('class')" class="h-14 px-5 rounded-full bg-primary text-on-primary shadow-xl flex items-center gap-2 hover:bg-primary-container active:scale-95 transition-all shadow-primary/30">
        <span class="material-symbols-outlined text-[24px]">add</span>
        <span class="font-label-lg text-label-lg font-bold">Add Entry</span>
      </button>
    </div>

  </main>

  <!-- ============================================== -->
  <!-- INTERACTIVE MODAL / DRAWER                     -->
  <!-- Supports TWO Input Methods:                    -->
  <!-- 1. Class Schedule                              -->
  <!-- 2. Break Period                                -->
  <!-- ============================================== -->
  <div id="scheduleModal" class="fixed inset-0 bg-inverse-surface/60 backdrop-blur-sm z-[100] hidden items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
    <div class="w-full max-w-lg bg-surface-container-lowest rounded-t-[28px] sm:rounded-[28px] shadow-2xl flex flex-col max-h-[92vh] sm:max-h-[85vh] overflow-hidden border border-surface-container-high/60">
      
      <!-- Fixed Modal Header: Drag handle + Title + Close + Segmented Switcher -->
      <div class="flex-shrink-0 px-5 pt-3.5 pb-3 flex flex-col gap-3 border-b border-surface-container-low bg-surface-container-lowest">
        <!-- Drag handle (mobile visual hint) -->
        <div class="w-12 h-1.5 bg-surface-container-highest rounded-full mx-auto -mt-1 mb-0.5 sm:hidden"></div>
        
        <!-- Header Title & Close Button -->
        <div class="flex items-center justify-between">
          <div class="flex flex-col">
            <h2 class="font-headline-sm text-headline-sm text-on-surface font-bold" id="modalHeaderTitle">Schedule a Class</h2>
            <span class="font-body-sm text-body-sm text-on-surface-variant text-xs" id="modalDaySubtitle">Select input method below</span>
          </div>
          <button type="button" onclick="closeScheduleModal()" aria-label="Close dialog" class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high active:scale-90 transition-all">
            <span class="material-symbols-outlined text-[20px]">close</span>
          </button>
        </div>

        <!-- Input Method Switcher Segmented Control (Class Schedule vs Break Period) -->
        <div class="flex p-1 rounded-2xl bg-surface-container-high shadow-inner gap-1">
          <button type="button" id="tabClassMethod" onclick="switchInputMethod('class')" class="flex-1 py-2 rounded-xl text-center font-label-md text-label-md font-bold flex items-center justify-center gap-1.5 transition-all bg-surface-container-lowest text-primary shadow-sm">
            <span class="material-symbols-outlined text-[18px]">school</span>
            <span>Class Schedule</span>
          </button>
          <button type="button" id="tabBreakMethod" onclick="switchInputMethod('break')" class="flex-1 py-2 rounded-xl text-center font-label-md text-label-md font-medium flex items-center justify-center gap-1.5 transition-all text-on-surface-variant hover:text-on-surface">
            <span class="material-symbols-outlined text-[18px]">local_cafe</span>
            <span>Break Period</span>
          </button>
        </div>
      </div>

      <!-- Dedicated Scrollable Body with Visible Scrollbar -->
      <div class="flex-1 min-h-0 overflow-y-auto px-5 py-4 modal-scroll-container">
        
        <!-- ======================================== -->
        <!-- METHOD 1: CLASS SCHEDULE FORM             -->
        <!-- ======================================== -->
        <form id="classScheduleForm" onsubmit="handleSaveClass(event)" class="flex flex-col gap-4 pb-2">
          
          <!-- Day of the Week -->
          <div class="flex flex-col gap-1">
            <label class="font-label-md text-label-md text-on-surface-variant font-semibold text-xs uppercase tracking-wider">Day of Week</label>
            <select id="classDaySelect" class="w-full h-11 px-3.5 rounded-xl bg-surface-container-low text-on-surface text-body-md focus:outline-none focus:ring-2 focus:ring-primary/40 border border-surface-container-high">
              <option value="Sunday">Sunday</option>
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
            </select>
          </div>

          <!-- Select Registered Subject -->
          <div class="flex flex-col gap-1">
            <label class="font-label-md text-label-md text-on-surface-variant font-semibold text-xs uppercase tracking-wider">Select Registered Subject</label>
            <select id="registeredSubjectSelect" onchange="handleSubjectSelectChange()" class="w-full h-11 px-3.5 rounded-xl bg-surface-container-low text-on-surface text-body-md focus:outline-none focus:ring-2 focus:ring-primary/40 border border-surface-container-high">
              <option value="CS-401 • Advanced Algorithms">CS-401 • Advanced Algorithms</option>
              <option value="CS-403 • Operating Systems">CS-403 • Operating Systems</option>
              <option value="CS-405 • Database Management Systems">CS-405 • Database Management Systems</option>
              <option value="CS-415L • Machine Learning Lab">CS-415L • Machine Learning Lab</option>
              <option value="CS-420 • Web Engineering">CS-420 • Web Engineering</option>
              <option value="MATH-302 • Applied Linear Algebra">MATH-302 • Applied Linear Algebra</option>
              <option value="CUSTOM">+ Other / Custom Subject</option>
            </select>
          </div>

          <!-- Custom Subject Details (Hidden unless "CUSTOM" chosen) -->
          <div id="customSubjectFields" class="hidden flex-col gap-space-sm p-3 rounded-xl bg-surface-container-low/60 border border-surface-container">
            <div class="flex flex-col gap-1">
              <label class="font-label-sm text-label-sm text-on-surface-variant">Subject Code</label>
              <input type="text" id="customSubjectCode" placeholder="e.g. EC-302" class="w-full h-10 px-3 rounded-lg bg-surface-container-lowest text-on-surface text-body-sm focus:outline-none border border-surface-container-high"/>
            </div>
            <div class="flex flex-col gap-1">
              <label class="font-label-sm text-label-sm text-on-surface-variant">Subject Name</label>
              <input type="text" id="customSubjectName" placeholder="e.g. Signal Processing" class="w-full h-10 px-3 rounded-lg bg-surface-container-lowest text-on-surface text-body-sm focus:outline-none border border-surface-container-high"/>
            </div>
          </div>

          <!-- Start Time & End Time (Clock Input Method) -->
          <div class="grid grid-cols-2 gap-space-sm">
            <div class="flex flex-col gap-1">
              <label class="font-label-md text-label-md text-on-surface-variant font-semibold flex items-center gap-1 text-xs uppercase tracking-wider">
                <span class="material-symbols-outlined text-[15px] text-primary">schedule</span>
                <span>Start Time (Clock)</span>
              </label>
              <input type="time" id="classStartTime" required value="09:00" class="w-full h-11 px-3 rounded-xl bg-surface-container-low text-on-surface text-body-md focus:outline-none focus:ring-2 focus:ring-primary/40 border border-surface-container-high font-mono"/>
            </div>

            <div class="flex flex-col gap-1">
              <label class="font-label-md text-label-md text-on-surface-variant font-semibold flex items-center gap-1 text-xs uppercase tracking-wider">
                <span class="material-symbols-outlined text-[15px] text-primary">alarm_on</span>
                <span>End Time (Clock)</span>
              </label>
              <input type="time" id="classEndTime" required value="10:00" class="w-full h-11 px-3 rounded-xl bg-surface-container-low text-on-surface text-body-md focus:outline-none focus:ring-2 focus:ring-primary/40 border border-surface-container-high font-mono"/>
            </div>
          </div>

          <!-- Room / Hall (Optional) -->
          <div class="flex flex-col gap-1">
            <label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between text-xs">
              <span class="font-semibold uppercase tracking-wider">Room / Hall</span>
              <span class="text-on-surface-variant/70 font-normal">Not necessary</span>
            </label>
            <input type="text" id="classRoom" placeholder="e.g. Room 204, LH-302 (Optional)" class="w-full h-11 px-3.5 rounded-xl bg-surface-container-low text-on-surface text-body-md focus:outline-none focus:ring-2 focus:ring-primary/40 border border-surface-container-high"/>
          </div>

          <!-- Lecturer (Optional) -->
          <div class="flex flex-col gap-1">
            <label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between text-xs">
              <span class="font-semibold uppercase tracking-wider">Lecturer / Professor</span>
              <span class="text-on-surface-variant/70 font-normal">Not necessary</span>
            </label>
            <input type="text" id="classLecturer" placeholder="e.g. Prof. Davis, Dr. Thorne (Optional)" class="w-full h-11 px-3.5 rounded-xl bg-surface-container-low text-on-surface text-body-md focus:outline-none focus:ring-2 focus:ring-primary/40 border border-surface-container-high"/>
          </div>

          <button type="submit" class="hidden" aria-hidden="true"></button>
        </form>

        <!-- ======================================== -->
        <!-- METHOD 2: BREAK PERIOD FORM               -->
        <!-- ======================================== -->
        <form id="breakPeriodForm" onsubmit="handleSaveBreak(event)" class="hidden flex-col gap-4 pb-2">
          
          <!-- Day of the Week -->
          <div class="flex flex-col gap-1">
            <label class="font-label-md text-label-md text-on-surface-variant font-semibold text-xs uppercase tracking-wider">Day of Week</label>
            <select id="breakDaySelect" class="w-full h-11 px-3.5 rounded-xl bg-surface-container-low text-on-surface text-body-md focus:outline-none focus:ring-2 focus:ring-tertiary/40 border border-surface-container-high">
              <option value="Sunday">Sunday</option>
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
            </select>
          </div>

          <!-- Select Break Title -->
          <div class="flex flex-col gap-1">
            <label class="font-label-md text-label-md text-on-surface-variant font-semibold text-xs uppercase tracking-wider">Select Break Title</label>
            <select id="breakTitleSelect" onchange="handleBreakSelectChange()" class="w-full h-11 px-3.5 rounded-xl bg-surface-container-low text-on-surface text-body-md focus:outline-none focus:ring-2 focus:ring-tertiary/40 border border-surface-container-high">
              <option value="Lunch Break">Lunch Break</option>
              <option value="Campus Commons Break">Campus Commons Break</option>
              <option value="Short Recess">Short Recess (15 mins)</option>
              <option value="Tea & Snack Break">Tea & Snack Break</option>
              <option value="Library / Self-Study Slot">Library / Self-Study Slot</option>
              <option value="Free Period">Free Period</option>
              <option value="CUSTOM">+ Custom Break Title</option>
            </select>
          </div>

          <!-- Custom Break Title (Hidden unless "CUSTOM" chosen) -->
          <div id="customBreakField" class="hidden flex-col gap-1 p-3 rounded-xl bg-surface-container-low/60 border border-surface-container">
            <label class="font-label-sm text-label-sm text-on-surface-variant">Custom Break Name</label>
            <input type="text" id="customBreakName" placeholder="e.g. Gym Session, Meditation" class="w-full h-10 px-3 rounded-lg bg-surface-container-lowest text-on-surface text-body-sm focus:outline-none border border-surface-container-high"/>
          </div>

          <!-- Start Time & End Time (Clock Input Method) -->
          <div class="grid grid-cols-2 gap-space-sm">
            <div class="flex flex-col gap-1">
              <label class="font-label-md text-label-md text-on-surface-variant font-semibold flex items-center gap-1 text-xs uppercase tracking-wider">
                <span class="material-symbols-outlined text-[15px] text-tertiary">schedule</span>
                <span>Start Time (Clock)</span>
              </label>
              <input type="time" id="breakStartTime" required value="12:00" class="w-full h-11 px-3 rounded-xl bg-surface-container-low text-on-surface text-body-md focus:outline-none focus:ring-2 focus:ring-tertiary/40 border border-surface-container-high font-mono"/>
            </div>

            <div class="flex flex-col gap-1">
              <label class="font-label-md text-label-md text-on-surface-variant font-semibold flex items-center gap-1 text-xs uppercase tracking-wider">
                <span class="material-symbols-outlined text-[15px] text-tertiary">alarm_on</span>
                <span>End Time (Clock)</span>
              </label>
              <input type="time" id="breakEndTime" required value="13:00" class="w-full h-11 px-3 rounded-xl bg-surface-container-low text-on-surface text-body-md focus:outline-none focus:ring-2 focus:ring-tertiary/40 border border-surface-container-high font-mono"/>
            </div>
          </div>

          <button type="submit" class="hidden" aria-hidden="true"></button>
        </form>

      </div>

      <!-- Sticky Modal Footer Action Bar (Always Visible, Pinned Above Nav Bar) -->
      <div class="flex-shrink-0 bg-surface-container-lowest border-t border-surface-container-low px-5 py-3.5 pb-[max(1rem,env(safe-area-inset-bottom))] flex items-center gap-3 shadow-[0_-4px_16px_rgba(0,0,0,0.04)]">
        <button type="button" onclick="closeScheduleModal()" class="flex-1 h-12 rounded-xl bg-surface-container text-on-surface font-label-lg text-label-lg font-bold hover:bg-surface-container-high active:scale-98 transition-all flex items-center justify-center gap-1.5">
          <span class="material-symbols-outlined text-[18px]">close</span>
          <span>Discard</span>
        </button>
        <button type="button" id="modalConfirmBtn" onclick="submitActiveScheduleForm()" class="flex-1 h-12 rounded-xl bg-primary text-on-primary font-label-lg text-label-lg font-bold shadow-md hover:bg-primary-container active:scale-98 transition-all flex items-center justify-center gap-1.5 shadow-primary/25">
          <span class="material-symbols-outlined text-[20px]" id="modalConfirmIcon">check_circle</span>
          <span id="modalConfirmBtnText">Confirm Class Slot</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Toast Notification (High Z-Index) -->
  <div id="toastNotification" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-4 py-2.5 rounded-full text-xs font-semibold shadow-2xl z-[120] transition-all opacity-0 pointer-events-none transform translate-y-3">
    Notification
  </div>

  <!-- ============================================== -->
  <!-- BOTTOM NAVIGATION (Clean Interconnected Links) -->
  <!-- ============================================== -->
  <nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.04)]" data-active-classes="[&amp;_.nav-pill]:bg-primary-fixed [&amp;_.nav-pill]:text-on-primary-fixed [&amp;_.nav-icon]:text-primary font-bold text-on-surface">
    <div class="flex justify-around items-center h-16 px-space-xs">
      <a class="flex flex-col items-center justify-center w-16 h-12 text-on-surface-variant group transition-all" data-path="home" href="index.html">
        <div class="nav-pill w-12 h-7 rounded-full flex items-center justify-center transition-all">
          <span class="material-symbols-outlined nav-icon text-[22px]">home</span>
        </div>
        <span class="font-label-sm text-label-sm mt-0.5">Home</span>
      </a>
      <a aria-current="page" class="flex flex-col items-center justify-center w-16 h-12 group transition-all [&amp;_.nav-pill]:bg-primary-fixed [&amp;_.nav-pill]:text-on-primary-fixed [&amp;_.nav-icon]:text-primary font-bold text-on-surface" data-path="timetable" href="timetable.html">
        <div class="nav-pill w-12 h-7 rounded-full flex items-center justify-center transition-all">
          <span class="material-symbols-outlined nav-icon text-[22px]" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
        </div>
        <span class="font-label-sm text-label-sm mt-0.5">Timetable</span>
      </a>
      <a class="flex flex-col items-center justify-center w-16 h-12 text-on-surface-variant group transition-all" data-path="tasks" href="tasks.html">
        <div class="nav-pill w-12 h-7 rounded-full flex items-center justify-center transition-all">
          <span class="material-symbols-outlined nav-icon text-[22px]">check_circle_outline</span>
        </div>
        <span class="font-label-sm text-label-sm mt-0.5">Tasks</span>
      </a>
      <a class="flex flex-col items-center justify-center w-16 h-12 text-on-surface-variant group transition-all" data-path="vault" href="vault.html">
        <div class="nav-pill w-12 h-7 rounded-full flex items-center justify-center transition-all">
          <span class="material-symbols-outlined nav-icon text-[22px]">folder_special</span>
        </div>
        <span class="font-label-sm text-label-sm mt-0.5">Vault</span>
      </a>
      <a class="flex flex-col items-center justify-center w-16 h-12 text-on-surface-variant group transition-all" data-path="profile" href="profile.html">
        <div class="nav-pill w-12 h-7 rounded-full flex items-center justify-center transition-all">
          <span class="material-symbols-outlined nav-icon text-[22px]">person_outline</span>
        </div>
        <span class="font-label-sm text-label-sm mt-0.5">Profile</span>
      </a>
    </div>
  </nav>

  <!-- ============================================== -->
  <!-- TIMETABLE SCHEDULER CONTROLLER JAVASCRIPT      -->
  <!-- ============================================== -->
  <script>
    // Real Calendar dynamic week cycle calculation (Sunday to Saturday)
    function calculateRealWeekDates() {
      const now = new Date();
      const currentDayIndex = now.getDay(); // 0 is Sunday, 1 is Monday ... 6 is Saturday
      
      // Calculate Sunday (start of current week cycle)
      const sunday = new Date(now);
      sunday.setDate(now.getDate() - currentDayIndex);
      sunday.setHours(0, 0, 0, 0);

      const DAY_NAMES = [
        { key: "Sunday", short: "Sun" },
        { key: "Monday", short: "Mon" },
        { key: "Tuesday", short: "Tue" },
        { key: "Wednesday", short: "Wed" },
        { key: "Thursday", short: "Thu" },
        { key: "Friday", short: "Fri" },
        { key: "Saturday", short: "Sat" }
      ];

      return DAY_NAMES.map((d, index) => {
        const dateObj = new Date(sunday);
        dateObj.setDate(sunday.getDate() + index);
        const isToday = index === currentDayIndex;
        const monthShort = dateObj.toLocaleDateString("en-US", { month: "short" });
        const dateNum = dateObj.getDate().toString();
        return {
          key: d.key,
          short: d.short,
          dateNum: dateNum,
          monthShort: monthShort,
          year: dateObj.getFullYear(),
          isToday: isToday,
          formatted: `${d.key}, ${monthShort} ${dateNum}`
        };
      });
    }

    let DAYS = calculateRealWeekDates();

    // LocalStorage Key
    const STORAGE_KEY = "college_os_timetable_events_v2";

    // State: Automatically defaults to current real day of week
    const currentTodayIndex = new Date().getDay();
    let activeDay = DAYS[currentTodayIndex]?.key || "Sunday";
    let events = [];

    // Initialize application
    function init() {
      DAYS = calculateRealWeekDates();
      loadEvents();
      updateModalDayOptions();
      renderDaysStrip();
      renderScheduleContent();
    }

    function updateModalDayOptions() {
      const classSelect = document.getElementById("classDaySelect");
      const breakSelect = document.getElementById("breakDaySelect");
      const optionsHtml = DAYS.map(d => `<option value="${d.key}">${d.key} (${d.monthShort} ${d.dateNum}${d.isToday ? ' • Today' : ''})</option>`).join("");
      if (classSelect) classSelect.innerHTML = optionsHtml;
      if (breakSelect) breakSelect.innerHTML = optionsHtml;
    }

    function loadEvents() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        events = raw ? JSON.parse(raw) : [];
      } catch (e) {
        events = [];
      }
    }

    function saveEvents() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      } catch (e) {
        console.error("Failed to save to localStorage", e);
      }
    }

    function resetTimetable() {
      if (confirm("Reset all schedule data and return to the first-time user empty state?")) {
        events = [];
        saveEvents();
        renderScheduleContent();
        showToast("Timetable cleared. First-time user state active.");
      }
    }

    // Render Sunday to Saturday Day Buttons using Real Calendar Dates
    function renderDaysStrip() {
      const container = document.getElementById("daysStrip");
      if (!container) return;

      container.innerHTML = DAYS.map(d => {
        const isActive = d.key === activeDay;
        if (isActive) {
          return `
            <button onclick="selectDay('${d.key}')" class="flex flex-col items-center justify-center py-2.5 rounded-2xl bg-primary text-on-primary shadow-md transition-all relative transform scale-105">
              <span class="font-label-sm text-label-sm text-primary-fixed-dim font-bold flex items-center gap-0.5">
                ${d.short}
                ${d.isToday ? '<span class="w-1.5 h-1.5 rounded-full bg-secondary-fixed ring-1 ring-surface-container-lowest"></span>' : ''}
              </span>
              <span class="font-headline-sm text-headline-sm font-extrabold text-on-primary mt-0.5 leading-none">${d.dateNum}</span>
              <span class="w-1.5 h-1.5 rounded-full bg-secondary-fixed mt-1"></span>
            </button>
          `;
        } else {
          return `
            <button onclick="selectDay('${d.key}')" class="flex flex-col items-center justify-center py-2 rounded-xl ${d.isToday ? 'bg-primary-fixed/40 border border-primary/30 text-primary font-bold shadow-xs' : 'bg-surface-container-low text-on-surface-variant hover:bg-surface-container'} active:scale-95 transition-all">
              <span class="font-label-sm text-label-sm ${d.isToday ? 'text-primary font-bold' : 'text-on-surface-variant font-medium'} flex items-center gap-0.5">
                ${d.short}
                ${d.isToday ? '<span class="w-1.5 h-1.5 rounded-full bg-primary"></span>' : ''}
              </span>
              <span class="font-headline-sm text-headline-sm ${d.isToday ? 'text-primary font-extrabold' : 'text-on-surface font-semibold'} mt-0.5 leading-none">${d.dateNum}</span>
              <span class="w-1.5 h-1.5 rounded-full ${d.isToday ? 'bg-primary' : 'bg-transparent'} mt-1"></span>
            </button>
          `;
        }
      }).join("");

      // Update active day label with real calendar date
      const activeObj = DAYS.find(d => d.key === activeDay);
      const label = document.getElementById("activeDayLabel");
      if (label && activeObj) {
        label.innerHTML = `${activeObj.formatted} ${activeObj.isToday ? '<span class="ml-1.5 px-2 py-0.5 rounded-full bg-secondary-container text-on-secondary-container text-[10px] font-bold">Today</span>' : ''}`;
      }

      // Update week horizon title
      const weekLabel = document.getElementById("weekRangeLabel");
      if (weekLabel && DAYS.length === 7) {
        weekLabel.textContent = `Week of ${DAYS[0].monthShort} ${DAYS[0].dateNum} – ${DAYS[6].monthShort} ${DAYS[6].dateNum}, ${DAYS[6].year}`;
      }
    }

    function selectDay(dayKey) {
      activeDay = dayKey;
      renderDaysStrip();
      renderScheduleContent();
    }

    // Format 24h clock time to 12h readable time
    function formatTime(t24) {
      if (!t24) return "";
      const [h, m] = t24.split(":").map(Number);
      const period = h >= 12 ? "PM" : "AM";
      const h12 = h % 12 || 12;
      return `${String(h12).padStart(2, "0")}:${String(m).padStart(2, "0")} ${period}`;
    }

    // Calculate duration in minutes between two clock inputs
    function calcDurationMins(start, end) {
      if (!start || !end) return 60;
      const [sh, sm] = start.split(":").map(Number);
      const [eh, em] = end.split(":").map(Number);
      let diff = (eh * 60 + em) - (sh * 60 + sm);
      if (diff <= 0) diff += 24 * 60;
      return diff;
    }

    // Render Timeline OR First-Time User Empty State
    function renderScheduleContent() {
      const container = document.getElementById("timetableContent");
      if (!container) return;

      const dayEvents = events.filter(e => e.day === activeDay);

      // Sort events chronologically by start time
      dayEvents.sort((a, b) => (a.startTime || "").localeCompare(b.startTime || ""));

      // FIRST TIME USER / EMPTY STATE
      if (dayEvents.length === 0) {
        container.innerHTML = `
          <div class="mt-4 p-space-xl rounded-[24px] bg-surface-container-lowest shadow-sm border border-surface-container flex flex-col items-center text-center">
            
            <!-- Graphic Icon Circle -->
            <div class="w-20 h-20 rounded-3xl bg-primary-fixed/40 text-primary flex items-center justify-center mb-4 shadow-inner">
              <span class="material-symbols-outlined text-[40px]">calendar_month</span>
            </div>

            <h3 class="font-headline-md text-headline-md text-on-surface font-bold">
              No Schedule for ${activeDay}
            </h3>
            
            <p class="font-body-md text-body-md text-on-surface-variant max-w-xs mt-2 leading-relaxed">
              First time setting up your timetable? Add your lectures or schedule break intervals for ${activeDay}.
            </p>

            <!-- Dual Action Input Method Triggers -->
            <div class="flex flex-col sm:flex-row items-center gap-space-sm w-full mt-6 max-w-sm">
              <button onclick="openScheduleModal('class')" class="w-full h-12 rounded-xl bg-primary text-on-primary font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 shadow-md hover:bg-primary-container active:scale-95 transition-all">
                <span class="material-symbols-outlined text-[20px]">school</span>
                <span>+ Add Class</span>
              </button>

              <button onclick="openScheduleModal('break')" class="w-full h-12 rounded-xl bg-surface-container text-on-surface hover:bg-surface-container-high font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 active:scale-95 transition-all border border-surface-container-high">
                <span class="material-symbols-outlined text-[20px] text-tertiary">local_cafe</span>
                <span>+ Add Break</span>
              </button>
            </div>

          </div>
        `;
        return;
      }

      // TIMELINE VIEW WITH EVENTS
      let html = `
        <div class="flex items-center justify-between mb-3 px-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider font-bold">
            ${dayEvents.length} Scheduled Slot${dayEvents.length > 1 ? "s" : ""}
          </span>
          <button onclick="openScheduleModal('class')" class="text-xs font-semibold text-primary hover:underline flex items-center gap-0.5">
            <span class="material-symbols-outlined text-[15px]">add</span> Add Another
          </button>
        </div>

        <div class="flex flex-col gap-space-md relative">
          <!-- Timeline Vertical Track -->
          <div class="absolute left-[3.35rem] top-3 bottom-6 w-[2px] bg-surface-container-highest z-0"></div>
      `;

      dayEvents.forEach(item => {
        const timeFormatted = formatTime(item.startTime);
        const [timeDigit, timePeriod] = timeFormatted.split(" ");
        const duration = calcDurationMins(item.startTime, item.endTime);

        if (item.type === "break") {
          // Break Period Card
          html += `
            <div class="flex gap-space-sm relative z-10 group">
              <div class="w-12 flex-shrink-0 flex flex-col items-end pt-1 pr-1">
                <span class="font-label-md text-label-md text-on-surface-variant font-bold">${timeDigit}</span>
                <span class="font-label-sm text-label-sm text-on-surface-variant">${timePeriod || ""}</span>
              </div>
              <div class="w-3 flex-shrink-0 flex items-center justify-center pt-2">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500 ring-4 ring-surface-container-lowest"></span>
              </div>
              <div class="flex-1 min-w-0 bg-surface-container-low rounded-xl p-3 flex items-center justify-between gap-space-sm shadow-none border border-surface-container-high/50 hover:bg-surface-container transition-all">
                <div class="flex items-center gap-2.5 min-w-0">
                  <div class="w-9 h-9 rounded-xl bg-amber-100 dark:bg-amber-950/40 text-amber-600 flex items-center justify-center flex-shrink-0">
                    <span class="material-symbols-outlined text-[18px]">local_cafe</span>
                  </div>
                  <div class="flex flex-col min-w-0">
                    <span class="font-label-md text-label-md text-on-surface font-bold truncate">${item.title}</span>
                    <span class="font-body-sm text-body-sm text-on-surface-variant truncate text-[11px]">${formatTime(item.startTime)} – ${formatTime(item.endTime)} • ${duration}m</span>
                  </div>
                </div>
                <div class="flex items-center gap-1">
                  <span class="px-2 py-0.5 rounded-full bg-surface-container-highest text-on-surface font-label-sm text-[11px] font-semibold">Break</span>
                  <button onclick="deleteEvent('${item.id}')" title="Delete break" class="w-7 h-7 rounded-lg text-on-surface-variant hover:text-error hover:bg-error-container/30 flex items-center justify-center active:scale-90 transition-all ml-1">
                    <span class="material-symbols-outlined text-[16px]">delete</span>
                  </button>
                </div>
              </div>
            </div>
          `;
        } else {
          // Class Schedule Card
          html += `
            <div class="flex gap-space-sm relative z-10 group">
              <div class="w-12 flex-shrink-0 flex flex-col items-end pt-1 pr-1">
                <span class="font-label-md text-label-md text-on-surface font-bold">${timeDigit}</span>
                <span class="font-label-sm text-label-sm text-on-surface-variant">${timePeriod || ""}</span>
              </div>
              <div class="w-3 flex-shrink-0 flex items-center justify-center pt-2">
                <span class="w-2.5 h-2.5 rounded-full bg-primary ring-4 ring-surface-container-lowest"></span>
              </div>
              <div class="flex-1 min-w-0 bg-surface-container-lowest rounded-xl p-space-md shadow-sm border border-surface-container-high/40 hover:shadow-md transition-all">
                <div class="flex items-center justify-between gap-space-xs">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="px-2 py-0.5 rounded-full bg-primary-fixed text-on-primary-fixed font-label-sm text-label-sm font-semibold">${item.code || "LECTURE"}</span>
                    <span class="font-label-sm text-label-sm text-on-surface-variant">${duration} mins</span>
                  </div>
                  <button onclick="deleteEvent('${item.id}')" title="Delete class slot" class="w-7 h-7 rounded-lg text-on-surface-variant hover:text-error hover:bg-error-container/30 flex items-center justify-center active:scale-90 transition-all">
                    <span class="material-symbols-outlined text-[16px]">delete</span>
                  </button>
                </div>

                <h3 class="font-headline-sm text-headline-sm text-on-surface font-bold mt-1.5 truncate">${item.name}</h3>
                
                <div class="flex items-center gap-space-md mt-2 pt-2 bg-surface-container-low/50 -mx-space-md px-space-md rounded-b-xl flex-wrap">
                  ${item.room ? `
                    <div class="flex items-center gap-1 min-w-0 text-on-surface-variant">
                      <span class="material-symbols-outlined text-[15px] text-primary">meeting_room</span>
                      <span class="font-body-sm text-body-sm truncate text-xs">${item.room}</span>
                    </div>
                  ` : ''}
                  ${item.lecturer ? `
                    <div class="flex items-center gap-1 min-w-0 text-on-surface-variant">
                      <span class="material-symbols-outlined text-[15px]">school</span>
                      <span class="font-body-sm text-body-sm truncate text-xs">${item.lecturer}</span>
                    </div>
                  ` : ''}
                  <div class="ml-auto text-xs text-on-surface-variant font-mono">
                    ${formatTime(item.startTime)} – ${formatTime(item.endTime)}
                  </div>
                </div>

              </div>
            </div>
          `;
        }
      });

      html += `</div>`;
      container.innerHTML = html;
    }

    // Modal Operations
    let currentScheduleMethod = 'class';

    function openScheduleModal(defaultMethod = 'class') {
      const modal = document.getElementById("scheduleModal");
      if (!modal) return;

      // Sync default day select
      const classDaySelect = document.getElementById("classDaySelect");
      const breakDaySelect = document.getElementById("breakDaySelect");
      if (classDaySelect) classDaySelect.value = activeDay;
      if (breakDaySelect) breakDaySelect.value = activeDay;

      const sub = document.getElementById("modalDaySubtitle");
      if (sub) sub.textContent = `Configuring slot for ${activeDay}`;

      switchInputMethod(defaultMethod);

      modal.classList.remove("hidden");
      modal.classList.add("flex");
      document.body.style.overflow = "hidden"; // Prevent body scroll behind modal
    }

    function closeScheduleModal() {
      const modal = document.getElementById("scheduleModal");
      if (modal) {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      }
      document.body.style.overflow = ""; // Restore body scrolling
    }

    function switchInputMethod(method) {
      currentScheduleMethod = method;
      const classTab = document.getElementById("tabClassMethod");
      const breakTab = document.getElementById("tabBreakMethod");
      const classForm = document.getElementById("classScheduleForm");
      const breakForm = document.getElementById("breakPeriodForm");
      const title = document.getElementById("modalHeaderTitle");
      const confirmBtn = document.getElementById("modalConfirmBtn");
      const confirmBtnText = document.getElementById("modalConfirmBtnText");
      const confirmIcon = document.getElementById("modalConfirmIcon");

      if (method === 'class') {
        classTab.classList.add("bg-surface-container-lowest", "text-primary", "shadow-sm");
        classTab.classList.remove("text-on-surface-variant");
        breakTab.classList.remove("bg-surface-container-lowest", "text-primary", "shadow-sm", "text-tertiary");
        breakTab.classList.add("text-on-surface-variant");

        classForm.classList.remove("hidden");
        classForm.classList.add("flex");
        breakForm.classList.add("hidden");
        breakForm.classList.remove("flex");
        if (title) title.textContent = "Schedule a Class";

        if (confirmBtn) {
          confirmBtn.className = "flex-1 h-12 rounded-xl bg-primary text-on-primary font-label-lg text-label-lg font-bold shadow-md hover:bg-primary-container active:scale-98 transition-all flex items-center justify-center gap-1.5 shadow-primary/25";
        }
        if (confirmBtnText) confirmBtnText.textContent = "Confirm Class Slot";
        if (confirmIcon) confirmIcon.textContent = "check_circle";
      } else {
        breakTab.classList.add("bg-surface-container-lowest", "text-tertiary", "shadow-sm");
        breakTab.classList.remove("text-on-surface-variant");
        classTab.classList.remove("bg-surface-container-lowest", "text-primary", "shadow-sm");
        classTab.classList.add("text-on-surface-variant");

        breakForm.classList.remove("hidden");
        breakForm.classList.add("flex");
        classForm.classList.add("hidden");
        classForm.classList.remove("flex");
        if (title) title.textContent = "Schedule a Break Period";

        if (confirmBtn) {
          confirmBtn.className = "flex-1 h-12 rounded-xl bg-tertiary text-on-tertiary font-label-lg text-label-lg font-bold shadow-md hover:bg-tertiary-container active:scale-98 transition-all flex items-center justify-center gap-1.5 shadow-tertiary/25";
        }
        if (confirmBtnText) confirmBtnText.textContent = "Confirm Break Period";
        if (confirmIcon) confirmIcon.textContent = "local_cafe";
      }
    }

    // Submit handler called by sticky modal footer action button
    function submitActiveScheduleForm() {
      const isClass = currentScheduleMethod === 'class';
      const form = document.getElementById(isClass ? "classScheduleForm" : "breakPeriodForm");
      if (!form) return;

      if (form.checkValidity && !form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const dummyEvt = { preventDefault: () => {} };
      if (isClass) {
        handleSaveClass(dummyEvt);
      } else {
        handleSaveBreak(dummyEvt);
      }
    }

    // Subject Dropdown Handler
    function handleSubjectSelectChange() {
      const select = document.getElementById("registeredSubjectSelect");
      const customDiv = document.getElementById("customSubjectFields");
      if (select && customDiv) {
        if (select.value === "CUSTOM") {
          customDiv.classList.remove("hidden");
          customDiv.classList.add("flex");
        } else {
          customDiv.classList.add("hidden");
          customDiv.classList.remove("flex");
        }
      }
    }

    // Break Title Dropdown Handler
    function handleBreakSelectChange() {
      const select = document.getElementById("breakTitleSelect");
      const customDiv = document.getElementById("customBreakField");
      if (select && customDiv) {
        if (select.value === "CUSTOM") {
          customDiv.classList.remove("hidden");
          customDiv.classList.add("flex");
        } else {
          customDiv.classList.add("hidden");
          customDiv.classList.remove("flex");
        }
      }
    }

    // Save Class Slot
    function handleSaveClass(e) {
      e.preventDefault();
      const day = document.getElementById("classDaySelect").value;
      const subChoice = document.getElementById("registeredSubjectSelect").value;
      let code = "";
      let name = "";

      if (subChoice === "CUSTOM") {
        code = document.getElementById("customSubjectCode").value.trim() || "COURSE";
        name = document.getElementById("customSubjectName").value.trim() || "Custom Subject";
      } else {
        const parts = subChoice.split(" • ");
        code = parts[0] || "COURSE";
        name = parts[1] || subChoice;
      }

      const startTime = document.getElementById("classStartTime").value;
      const endTime = document.getElementById("classEndTime").value;
      const room = document.getElementById("classRoom").value.trim();
      const lecturer = document.getElementById("classLecturer").value.trim();

      const newEvent = {
        id: "class_" + Date.now(),
        type: "class",
        day,
        code,
        name,
        startTime,
        endTime,
        room,
        lecturer
      };

      events.push(newEvent);
      saveEvents();
      closeScheduleModal();

      // Navigate to this day to show the added class
      activeDay = day;
      renderDaysStrip();
      renderScheduleContent();
      showToast(`Class "${code}" scheduled for ${day}!`);
    }

    // Save Break Period
    function handleSaveBreak(e) {
      e.preventDefault();
      const day = document.getElementById("breakDaySelect").value;
      const breakChoice = document.getElementById("breakTitleSelect").value;
      let title = breakChoice;

      if (breakChoice === "CUSTOM") {
        title = document.getElementById("customBreakName").value.trim() || "Break";
      }

      const startTime = document.getElementById("breakStartTime").value;
      const endTime = document.getElementById("breakEndTime").value;

      const newEvent = {
        id: "break_" + Date.now(),
        type: "break",
        day,
        title,
        startTime,
        endTime
      };

      events.push(newEvent);
      saveEvents();
      closeScheduleModal();

      activeDay = day;
      renderDaysStrip();
      renderScheduleContent();
      showToast(`Break "${title}" scheduled for ${day}!`);
    }

    // Delete Event
    function deleteEvent(id) {
      events = events.filter(e => e.id !== id);
      saveEvents();
      renderScheduleContent();
      showToast("Schedule slot removed.");
    }

    // Notification toast helper
    function showToast(msg) {
      const toast = document.getElementById("toastNotification");
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.remove("opacity-0", "translate-y-3");
      toast.classList.add("opacity-100", "translate-y-0");
      setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "translate-y-3");
      }, 2500);
    }

    // Close modal on click outside
    window.addEventListener("click", function(e) {
      const modal = document.getElementById("scheduleModal");
      if (e.target === modal) {
        closeScheduleModal();
      }
    });

    // Start on DOM load
    document.addEventListener("DOMContentLoaded", init);
  </script>
